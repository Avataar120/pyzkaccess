set_user:
  fields:
    device_id: &device
      required: true
      selector:
        device:
          integration: zkaccess_native
    user_id: &user_id
      required: true
      selector:
        number: {min: 1, max: 999999999, mode: box}
    name: {selector: {text: {}}}
    card: {selector: {number: {min: 0, max: 4294967295, mode: box}}}
    code: {selector: {text: {type: password}}}
delete_user:
  fields: {device_id: *device, user_id: *user_id}
grant:
  fields:
    device_id: *device
    user_id: *user_id
    timezone: {default: 1, selector: {number: {min: 1, max: 255, mode: box}}}
    doors: {default: 1, selector: {number: {min: 1, max: 15, mode: box}}}
revoke:
  fields: {device_id: *device, user_id: *user_id}
open_door:
  fields:
    device_id: *device
    door: {default: 1, selector: {number: {min: 1, max: 4}}}
    seconds: {default: 5, selector: {number: {min: 1, max: 254, unit_of_measurement: s}}}
sync_clock:
  fields: {device_id: *device}
list_users:
  fields: {device_id: *device}
backup:
  fields: {device_id: *device}
set_access:
  fields:
    device_id: *device
    person:
      required: true
      selector:
        number: {min: 1, max: 99999, mode: box}
    category:
      selector:
        number: {min: 0, max: 9, mode: box}
    enabled:
      required: true
      selector:
        boolean: {}
rename_person:
  fields:
    device_id: *device
    person:
      required: true
      selector:
        number: {min: 1, max: 99999, mode: box}
    name:
      required: true
      selector:
        text: {}
restart:
  fields:
    device_id: *device
