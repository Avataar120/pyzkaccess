# Example automations for the ZKAccess Native Home Assistant integration.
# Copy what you need into automations.yaml and replace the entity ids with your own.
#
# Every access is fired on the bus as `zkaccess_native_access` with, among others:
#   result         granted (the device released its door) / action (known credential of a
#                  category without relay) / denied / other
#   method         fingerprint / card / code / phone / remote / other
#   person, person_name, ha_person, category, category_digit, category_type, gesture (single /
#   double), toggle, phone, user_id, card, door
# A known credential is "granted" or "action" depending only on the category's
# "Device relay" setting: react to both. Unknown fingers and cards are always "denied".

# --- Open: pulse a relay driven by Home Assistant and disarm the alarm ------------------------
- alias: "Front door - open"
  triggers:
    - trigger: event
      event_type: zkaccess_native_access
      event_data:
        category_type: open
  conditions:
    - "{{ trigger.event.data.result in ['granted', 'action'] }}"
  actions:
    - action: switch.turn_on                     # door strike wired to a relay module
      target: { entity_id: switch.front_door_strike }
    - delay: { seconds: 3 }
    - action: switch.turn_off
      target: { entity_id: switch.front_door_strike }
    - action: alarm_control_panel.alarm_disarm
      target: { entity_id: alarm_control_panel.home }
      data: { code: !secret alarm_code }
  mode: queued

# --- Leave: lock and arm (an "Arm" finger, or the second presentation of the Open finger) ---
- alias: "Front door - lock and arm"
  triggers:
    - trigger: event
      event_type: zkaccess_native_access
      event_data:
        category_type: arm
  conditions:
    - "{{ trigger.event.data.result in ['granted', 'action'] }}"
  actions:
    - action: lock.lock
      target: { entity_id: lock.front_door }
    - action: alarm_control_panel.alarm_arm_away
      target: { entity_id: alarm_control_panel.home }
      data: { code: !secret alarm_code }

# --- A custom category: the garage door ------------------------------------------------------
- alias: "Front door - garage"
  triggers:
    - trigger: event
      event_type: zkaccess_native_access
      event_data:
        category: Garage                          # the name given in Settings
  conditions:
    - "{{ trigger.event.data.result in ['granted', 'action'] }}"
  actions:
    - action: cover.toggle
      target: { entity_id: cover.garage }

# --- Rules by method: phones only open in the daytime, cards never disarm ----------------------
- alias: "Front door - open by phone (daytime only)"
  triggers:
    - trigger: event
      event_type: zkaccess_native_access
      event_data:
        method: phone
        category_type: open
  conditions:
    - "{{ trigger.event.data.result in ['granted', 'action'] }}"
    - condition: time
      after: "07:00:00"
      before: "22:00:00"
  actions:
    - action: lock.unlock
      target: { entity_id: lock.front_door }

- alias: "Front door - card opens without disarming"
  triggers:
    - trigger: event
      event_type: zkaccess_native_access
      event_data:
        method: card
  conditions:
    - "{{ trigger.event.data.result in ['granted', 'action'] }}"
    - "{{ trigger.event.data.category_type == 'open' }}"
  actions:
    - action: lock.unlock
      target: { entity_id: lock.front_door }

# --- Per person: welcome home (needs the person linked to a Home Assistant person) -------------
- alias: "Front door - welcome"
  triggers:
    - trigger: event
      event_type: zkaccess_native_access
      event_data:
        category_type: open
  conditions:
    - "{{ trigger.event.data.result in ['granted', 'action'] }}"
    - "{{ trigger.event.data.ha_person == 'person.alice' }}"
    - condition: sun
      after: sunset
  actions:
    - action: light.turn_on
      target: { entity_id: light.hall }

# --- Second presentation (double badge) as its own trigger --------------------------------------
- alias: "Front door - double badge"
  triggers:
    - trigger: event
      event_type: zkaccess_native_access
      event_data:
        gesture: double
  actions:
    - action: notify.mobile_app_phone
      data:
        message: "{{ trigger.event.data.person_name }}: {{ trigger.event.data.category }} (double badge)"

# --- Security: three refused attempts in a minute -----------------------------------------------
- alias: "Front door - repeated refusals"
  triggers:
    - trigger: event
      event_type: zkaccess_native_access
      event_data:
        result: denied
  actions:
    - action: counter.increment
      target: { entity_id: counter.front_door_refusals }
    - if: "{{ states('counter.front_door_refusals') | int >= 3 }}"
      then:
        - action: camera.snapshot
          target: { entity_id: camera.front_door }
          data: { filename: /config/www/front_door_refused.jpg }
        - action: notify.mobile_app_phone
          data:
            message: "3 refused attempts at the front door ({{ trigger.event.data.event_name }})"
            data: { image: /local/front_door_refused.jpg }
        - action: counter.reset
          target: { entity_id: counter.front_door_refusals }
    - delay: { minutes: 1 }
    - action: counter.reset
      target: { entity_id: counter.front_door_refusals }
  mode: restart

# --- The reader stopped answering --------------------------------------------------------------
- alias: "Front door - reader offline"
  triggers:
    - trigger: state
      entity_id: binary_sensor.front_door_connected
      to: "off"
      for: { minutes: 3 }
  actions:
    - action: notify.mobile_app_phone
      data:
        message: "The fingerprint reader has not answered for 3 minutes."

# --- Log every access in the logbook ------------------------------------------------------------
- alias: "Front door - log every access"
  triggers:
    - trigger: event
      event_type: zkaccess_native_access
  actions:
    - action: logbook.log
      data:
        name: "{{ trigger.event.data.person_name or 'Front door' }}"
        message: >-
          {{ trigger.event.data.result }} - {{ trigger.event.data.category or trigger.event.data.event_name }}
          ({{ trigger.event.data.method }})
