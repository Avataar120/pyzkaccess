# Example automations for the ZKAccess Native Home Assistant integration.
# Replace entity ids and notify targets with your own.
# Event fields: result (granted / action / denied / other), person, person_name, ha_person,
# category, category_digit, category_type, gesture (single / double), method, user_id, card, door.

- alias: "Front door - open"
  triggers:
    - trigger: event
      event_type: zkaccess_native_access
      event_data:
        category_type: open
  conditions:
    - "{{ trigger.event.data.result in ['granted', 'action'] }}"
  actions:
    - action: lock.unlock
      target:
        entity_id: lock.front_door

- alias: "Front door - arm when leaving (Arm finger, or second badge)"
  triggers:
    - trigger: event
      event_type: zkaccess_native_access
      event_data:
        category_type: arm
  conditions:
    - "{{ trigger.event.data.result in ['granted', 'action'] }}"
  actions:
    - action: lock.lock
      target:
        entity_id: lock.front_door
    - action: alarm_control_panel.alarm_arm_away
      target:
        entity_id: alarm_control_panel.home

- alias: "Front door - log every access"
  triggers:
    - trigger: event
      event_type: zkaccess_native_access
  actions:
    - action: logbook.log
      data:
        name: "{{ trigger.event.data.person_name or 'Front door' }}"
        message: >-
          {{ trigger.event.data.result }} - {{ trigger.event.data.category or trigger.event.data.event_name }}
          ({{ trigger.event.data.method }})
